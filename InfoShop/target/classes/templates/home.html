<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InfoShop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <script th:src="@{/js/loja.js}" defer></script>
</head>
<body>

    <header class="topo">
        <div class="largura topo-barra">
            <a class="marca" th:href="@{/home}">Info<b>Shop</b></a>

            <form class="busca" id="form-busca" role="search">
                <label for="busca" class="so-leitor">Buscar produto</label>
                <input id="busca" type="search" placeholder="Buscar por produto" autocomplete="off">
                <button type="submit" aria-label="Buscar">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
                    </svg>
                </button>
            </form>

            <a class="carrinho" th:href="@{/carrinho}">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/>
                    <path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L21 7H6"/>
                </svg>
                Carrinho <span class="selo" th:text="${qtdCarrinho}">0</span>
            </a>
        </div>

        <nav class="menu" aria-label="Principal">
            <div class="largura menu-lista">
                <a class="ativo" th:href="@{/home}" aria-current="page">Home</a>
                <a th:href="@{/carrinho}">Meu carrinho</a>
                <a th:if="${ehAdmin}" th:href="@{/admin/painel}">Painel admin</a>

                <span class="menu-espaco"></span>

                <span class="menu-usuario">Olá, <strong th:text="${nome}"></strong></span>
                <form class="menu-sair" th:action="@{/logout}" method="post">
                    <button type="submit">Sair</button>
                </form>
            </div>
        </nav>
    </header>

    <div class="trilha">
        <div class="largura">› Home <span aria-hidden="true">/</span> Produtos</div>
    </div>

    <div class="largura corpo">

        <aside class="lateral" aria-label="Filtros">
            <section class="bloco">
                <h2>Ordenar por</h2>
                <fieldset class="bloco-corpo">
                    <legend class="so-leitor">Ordenar por</legend>
                    <label><input type="radio" name="ordem" value="padrao" checked> Padrão</label>
                    <label><input type="radio" name="ordem" value="menor"> Menor preço</label>
                    <label><input type="radio" name="ordem" value="maior"> Maior preço</label>
                    <label><input type="radio" name="ordem" value="nome"> Nome (A–Z)</label>
                </fieldset>
            </section>

            <section class="bloco">
                <h2>Filtrar por</h2>
                <div class="bloco-corpo">
                    <p class="bloco-titulo">Preço (R$)</p>
                    <div class="faixa">
                        <label class="so-leitor" for="preco-min">Preço mínimo</label>
                        <input id="preco-min" type="number" min="0" step="1" inputmode="numeric" placeholder="Mín.">
                        <span aria-hidden="true">–</span>
                        <label class="so-leitor" for="preco-max">Preço máximo</label>
                        <input id="preco-max" type="number" min="0" step="1" inputmode="numeric" placeholder="Máx.">
                    </div>
                    <button type="button" class="botao-claro" id="limpar">Limpar filtros</button>
                </div>
            </section>
        </aside>

        <main class="principal">
            <p class="mensagem sucesso" role="status" th:if="${sucesso}" th:text="${sucesso}"></p>
            <p class="mensagem erro" role="alert" th:if="${erro}" th:text="${erro}"></p>

            <h1 class="titulo">Produtos</h1>

            <div class="faixa-saldo">
                <div>
                    <p class="faixa-rotulo">Seu saldo disponível</p>
                    <p class="faixa-valor">R$ <span th:text="${#numbers.formatDecimal(saldo, 1, 'POINT', 2, 'COMMA')}"></span></p>
                </div>
                <a class="botao-destaque" th:href="@{/carrinho}">Ver carrinho</a>
            </div>

            <p class="contagem" id="contagem" aria-live="polite"></p>

            <section class="produtos" id="lista">
                <article class="produto" th:each="p, status : ${produtos}"
                         th:data-nome="${p.nome}" th:data-valor="${p.valor}" th:data-indice="${status.index}">
                        <a class="produto-link" th:href="@{/produto/{id}(id=${p.id})}">
                            <div class="produto-foto">
                                <img th:src="${p.caminhoImagem}" th:alt="${p.nome}" loading="lazy">
                            </div>
                            <h2 class="produto-nome" th:text="${p.nome}"></h2>
                        </a>

                    <h2 class="produto-nome" th:text="${p.nome}"></h2>
                    <p class="produto-desc" th:text="${p.descricao}"></p>

                    <p class="produto-preco">R$ <span th:text="${#numbers.formatDecimal(p.valor, 1, 'POINT', 2, 'COMMA')}"></span></p>

                    <form th:action="@{/carrinho/adicionar/{id}(id=${p.id})}" method="post">
                        <button type="submit" class="botao-adicionar">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/>
                                <path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L21 7H6"/>
                            </svg>
                            Adicionar
                        </button>
                    </form>
                </article>
            </section>

            <p class="vazio" id="vazio" hidden>Nenhum produto encontrado com esses filtros.</p>
        </main>
    </div>

    <footer class="rodape">
        <div class="largura">InfoShop</div>
    </footer>

</body>
</html>
