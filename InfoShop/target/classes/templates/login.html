<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar - InfoShop</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <main>
        <h1>Entrar</h1>

        <p th:if="${param.error}">Email ou senha inválidos.</p>
        <p th:if="${param.logout}">Você saiu do sistema.</p>
        <p th:if="${param.registrado}">Cadastro feito. Faça login.</p>

        <form th:action="@{/login}" method="post">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autofocus>

            <label for="password">Senha</label>
            <input id="password" name="password" type="password" required>

            <button type="submit">Entrar</button>
        </form>

        <a th:href="@{/registro}">Criar conta</a>
    </main>
</body>
</html>
